name: Build Linux Dolphin

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          sudo apt update && sudo apt upgrade
          sudo apt install \
            libegl1-mesa-dev \
            ffmpeg \
            libudev-dev \
            libevdev-dev \
            build-essential \
            cmake \
            qt6-base-dev \
            qt6-tools-dev \
            libqt6svg6-dev \
            libavcodec-dev \
            libavformat-dev \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libglew-dev \
            libgtk-3-dev \
            libopenal-dev \
            libreadline-dev \
            libxrandr-dev \
            libx11-dev \
            libasound2-dev \
            libpulse-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libpng-dev \
            libjpeg-dev \
            libz-dev \
            libxext-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            libgtkglext1-dev \
            libgtest-dev \
            libgmp-dev \
            liblz4-dev \
            liblzma-dev \
            libsnappy-dev \
            libtinyxml2-dev \
            libxi-dev \
            libxinerama-dev \
            libx11-xcb-dev \
            libxcb-glx0-dev \
            libxcb1-dev \
            libxcb-dri3-dev \
            libxcb-dri2-0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shape0-dev \
            libxcb-xinerama0-dev \
            libxcb-util-dev \
            libxcb-icccm4-dev \
            libxcb-keysyms1-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build Dolphin
        run: |
          # On Ubuntu some include files are missing for Qt6, we copy those manually
          # Hacky, but it works anyways
          sudo cp -r Externals/Qt/Qt6.5.1/x64/include/QtGui/6.5.1/QtGui/qpa/ /usr/include/
          cmake -Bbuild . -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DLINUX_LOCAL_DEV=true -DUSE_SYSTEM_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cd build
          make -j$(nproc)
          cp -r ../Data/Sys/ Binaries/

      - name: Upload Build
        uses: actions/upload-artifact@v6
        with:
          name: DolphinLinux
          path: build/Binaries
